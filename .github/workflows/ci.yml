name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, newest wins. Without this an image build that wedges stays
# queued behind every later push, and its runner is held for hours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches a source file silently excluded by .gitignore, and the
      # misspelling of the product name, both of which have shipped before.
      - run: ./tools/check.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version`: pnpm/action-setup reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Domain packages, API integration tests, PWA offline rules, and a jsdom
      # run of the real application and of the dashboard card.
      - run: pnpm test
      # HACS serves the card from autiplanner-card.js in the repository, so the
      # committed bundle is what users get. Rebuilding it and diffing proves it is
      # not stale, which a test on the TypeScript source cannot show.
      - name: The committed card bundle is up to date
        run: |
          pnpm --filter @autiplanner/card build
          git diff --exit-code -- autiplanner-card.js

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component pins Home Assistant 2026.2.3,
          # which is tested against this Python version.
          python-version: "3.13"
      # The pure helpers need nothing but the standard library.
      - run: python -m unittest discover -s tests -t . -v
      # Config-flow, entity, and service tests against a real Home Assistant.
      - run: pip install -r requirements-test.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: autiplanner-saas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          mkdir -p data-test
          # A bind mount at /data owned by the runner (not uid 100) mirrors how
          # Supervisor mounts an app's data directory. The old -e DATA_DIR=/tmp/data
          # used a world-writable path and hid the permission bug.
          docker run -d --name autiplanner -p 8080:8080 -v "$PWD/data-test:/data" autiplanner-saas:ci

      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs autiplanner
          exit 1

      - name: The PWA is served
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q "AutiPlanner"
          curl -fsS -o /dev/null http://127.0.0.1:8080/app.js
          curl -fsS -o /dev/null http://127.0.0.1:8080/sw.js
          curl -fsS -o /dev/null http://127.0.0.1:8080/manifest.webmanifest

      - name: Round trip through the running image
        run: |
          curl -fsS -X POST http://127.0.0.1:8080/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"a perfectly good password"}' \
            -o /tmp/session.json
          node -e "
            const session = require('/tmp/session.json');
            if (!session.token) throw new Error('no token returned');
            console.log('registered', session.account.email);
          "

      - if: always()
        run: docker logs autiplanner || true

  # Builds the image once per architecture on a runner of that architecture, then
  # joins them into one multi-architecture tag.
  #
  # This used to be a single amd64 runner with QEMU emulating arm64. That worked
  # only while every layer was cached: with a cold dependency layer, the emulated
  # arm64 install died with "qemu: uncaught target signal 4 (Illegal instruction)"
  # and the job retried until it timed out. QEMU's arm64 emulation does not cover
  # the instructions the native package binaries use, and the host CPU is amd64 so
  # nothing can supply them. A native arm64 runner removes the emulation from the
  # build entirely.
  build-image:
    needs: [repository, typescript, test, home-assistant, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            # Free on a public repository. This label is the whole point: no QEMU.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the version
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lower case: a container registry rejects upper case paths, and the
          # repository name contains capitals.
          images: ghcr.io/lunikodevelopment/autiplanner-saas
          # Only the version is used here. The tags themselves are applied by the
          # manifest job, which is the one that knows both architectures.
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short

      # Each architecture is pushed under its own staging tag, unique to this run
      # and not just this commit: pushing main and then tagging the same commit
      # starts two runs with the same sha, and shared staging tags let one run
      # overwrite a source manifest the other is still assembling. The manifest
      # job names them the same way, so no digest plumbing is needed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/lunikodevelopment/autiplanner-saas:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          # Without this each staging tag is an index of the platform manifest
          # plus a provenance attestation, so joining two of them assembles a
          # nested index and the finished tag carries two unknown/unknown
          # entries. Supervisor pulls one image per architecture and has no use
          # for an attestation, so the manifest is kept to exactly two platforms.
          provenance: false
          # Stamped into the io.hass.version label so the image identifies itself
          # as the same version as the tag Supervisor pulls.
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Proved on the architecture it was built for, natively, so this needs no
      # emulation either.
      - name: The image starts on its own architecture
        run: |
          set -euo pipefail
          image="ghcr.io/lunikodevelopment/autiplanner-saas:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}"
          docker pull "$image"
          docker run -d --name autiplanner -p 8082:8080 -v "$PWD/data-${{ matrix.arch }}":/data "$image"
          healthy=no
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8082/api/health >/dev/null 2>&1; then
              healthy=yes
              break
            fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8082/api/health || true
          echo
          docker logs autiplanner 2>&1 | tail -5 || true
          docker rm -f autiplanner >/dev/null
          if [ "$healthy" != "yes" ]; then
            echo "ERROR: ${{ matrix.arch }} did not become healthy"
            exit 1
          fi
          echo "${{ matrix.arch }} is healthy"

      - name: Summary
        if: matrix.arch == 'amd64'
        run: |
          {
            echo "### Published image"
            echo
            echo "Built natively for linux/amd64 and linux/arm64, and each was"
            echo "started on a runner of its own architecture."
          } >> "$GITHUB_STEP_SUMMARY"

  # Joins the two per-architecture tags into the tags a user actually pulls.
  publish:
    needs: [build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lunikodevelopment/autiplanner-saas
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The tag list arrives through the environment, never spliced into the
      # script. metadata-action returns it newline separated, so writing
      # `for tag in ${{ steps.meta.outputs.tags }}` into a run block expands to
      # one word per line and the shell reads the following line as a command of
      # its own. It failed that way three times before this was found.
      - name: Create the multi-architecture manifest
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
          STAGING_PREFIX: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            args+=("-t" "$tag")
          done <<< "$RELEASE_TAGS"
          # An empty list would make imagetools create an untagged manifest and
          # look like it worked.
          if [ ${#args[@]} -eq 0 ]; then
            echo "ERROR: metadata-action resolved no tags to publish"
            exit 1
          fi
          sources=(
            "ghcr.io/lunikodevelopment/autiplanner-saas:${STAGING_PREFIX}-amd64"
            "ghcr.io/lunikodevelopment/autiplanner-saas:${STAGING_PREFIX}-arm64"
          )
          echo "Joining ${#sources[@]} builds into ${args[*]}"
          # Echoed before the join, so a failure says what it was given rather
          # than only that it failed.
          for ref in "${sources[@]}"; do
            echo "--- $ref"
            docker buildx imagetools inspect "$ref" | grep -E "MediaType|Digest|Platform" || true
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      # Checked before the staging tags are removed, so a failure leaves the
      # evidence in the registry to look at.
      - name: The manifest carries both architectures
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -uo pipefail
          failed=no
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            # Captured rather than piped: under pipefail a `grep -q` that exits on
            # the first match kills the writer with SIGPIPE and the pipeline
            # fails even though the match succeeded.
            if ! platforms=$(docker buildx imagetools inspect "$tag" 2>&1); then
              echo "ERROR: could not inspect $tag"
              echo "$platforms"
              failed=yes
              continue
            fi
            for arch in amd64 arm64; do
              case "$platforms" in
                *"$arch"*) echo "$tag carries $arch" ;;
                *) echo "ERROR: $tag is missing $arch"; failed=yes ;;
              esac
            done
          done <<< "$RELEASE_TAGS"
          if [ "$failed" = "yes" ]; then
            exit 1
          fi
          {
            echo "### Published image"
            echo
            echo "| Tag | Architectures |"
            echo "|---|---|"
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              echo "| \`$tag\` | linux/amd64, linux/arm64 |"
            done <<< "$RELEASE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

      # Publish runs on every push to main, so the staging tags would pile up in
      # the registry forever. Best effort, and only once the manifest is known to
      # be good: a registry that refuses the delete must not fail a release that
      # is already published, and a failed release must stay debuggable.
      - name: Remove the staging tags
        if: success()
        env:
          STAGING_PREFIX: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for arch in amd64 arm64; do
            ref="ghcr.io/lunikodevelopment/autiplanner-saas:${STAGING_PREFIX}-${arch}"
            # Parsed from the report, not asked for as a template field:
            # `--format '{{.Manifest.Digest}}'` is not a field buildx knows, so
            # it ignores the template and prints the whole report, which put the
            # entire listing into the delete URL and quietly removed nothing.
            digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null | awk '/^Digest:/ {print $2; exit}')
            if [ -z "$digest" ]; then
              echo "could not read a digest for $ref, leaving it in place"
              continue
            fi
            curl -fsS -X DELETE \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://ghcr.io/v2/lunikodevelopment/autiplanner-saas/manifests/$digest" \
              && echo "removed $ref" || echo "could not remove $ref, leaving it"
          done

