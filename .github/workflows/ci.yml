name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Catches a source file silently excluded by .gitignore, and the
      # misspelling of the product name, both of which have shipped before.
      - run: ./tools/check.sh

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version`: pnpm/action-setup reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Domain packages, API integration tests, PWA offline rules, and a jsdom
      # run of the real application.
      - run: pnpm test

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component pins Home Assistant 2026.2.3,
          # which is tested against this Python version.
          python-version: "3.13"
      # The pure helpers need nothing but the standard library.
      - run: python -m unittest discover -s tests -t . -v
      # Config-flow, entity, and service tests against a real Home Assistant.
      - run: pip install -r requirements-test.txt
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: autiplanner-saas:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container
        run: |
          docker run -d --name autiplanner -p 8080:8080 -e DATA_DIR=/tmp/data autiplanner-saas:ci

      - name: Wait for health
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"
          docker logs autiplanner
          exit 1

      - name: The PWA is served
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q "AutiPlanner"
          curl -fsS -o /dev/null http://127.0.0.1:8080/app.js
          curl -fsS -o /dev/null http://127.0.0.1:8080/sw.js
          curl -fsS -o /dev/null http://127.0.0.1:8080/manifest.webmanifest

      - name: Round trip through the running image
        run: |
          curl -fsS -X POST http://127.0.0.1:8080/api/auth/register \
            -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"a perfectly good password"}' \
            -o /tmp/session.json
          node -e "
            const session = require('/tmp/session.json');
            if (!session.token) throw new Error('no token returned');
            console.log('registered', session.account.email);
          "

      - if: always()
        run: docker logs autiplanner || true

  # Publishes to the GitHub Container Registry so the image can be pulled onto a
  # host instead of being built there. Runs only for the default branch and for
  # version tags, and only after the image has been proved to work above.
  publish:
    needs: [repository, typescript, test, home-assistant, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The runner is amd64. Publishing an amd64-only image means anyone on an
      # Apple Silicon Mac or an arm64 VPS gets "no matching manifest", so the
      # image is built for both and QEMU lets the result be run here to prove it.
      - uses: docker/setup-qemu-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lower case: a container registry rejects upper case paths, and the
          # repository name contains capitals.
          images: ghcr.io/lunikodevelopment/autiplanner-saas
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A multi-platform manifest can still contain an image that does not boot.
      # Starting each architecture catches that before anyone pulls it.
      - name: The published image starts on both architectures
        run: |
          set -euo pipefail
          image="ghcr.io/lunikodevelopment/autiplanner-saas:latest"
          for platform in linux/amd64 linux/arm64; do
            echo "::group::$platform"
            docker pull --platform "$platform" "$image"
            cid=$(docker run -d --platform "$platform" -p 8082:8080 -e DATA_DIR=/tmp/data "$image")
            healthy=no
            for _ in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:8082/api/health > /dev/null 2>&1; then
                healthy=yes
                break
              fi
              sleep 3
            done
            curl -fsS http://127.0.0.1:8082/api/health || true
            echo
            docker logs "$cid" 2>&1 | tail -5 || true
            docker rm -f "$cid" > /dev/null
            echo "::endgroup::"
            if [ "$healthy" != "yes" ]; then
              echo "ERROR: $platform did not become healthy"
              exit 1
            fi
            echo "$platform is healthy"
          done

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Platforms: linux/amd64, linux/arm64 - both started and answered"
            echo "/api/health before this job finished."
          } >> "$GITHUB_STEP_SUMMARY"
